[package]
name = "jj-agentic-aspect"
version = "0.0.0"                 # unused; real version injected via build.rs -> JJ_VERSION
edition = "2021"
repository = "https://github.com/yigegongjiang/jj-agentic-aspect"
publish = false

# One binary (src/main.rs -> jj-agentic-aspect, subcommands plan/ask/hook) +
# one lib (src/lib.rs, shared helpers + subcommand modules) — auto-discovered,
# no explicit [[bin]]/[lib] tables needed.

[dependencies]
ureq = "2"                                                # blocking HTTP client (rustls TLS)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # keep JSON key order == JS JSON.stringify

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
